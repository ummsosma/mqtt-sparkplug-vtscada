name: ci

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Every setting must be forwarded by compose
        run: python tests/check_settings_forwarded.py

      - name: Every pipeline.<module>.<name> reference must exist
        run: python tests/check_module_refs.py

      - name: No committed secret value, no tracked .env
        run: python tests/check_no_secrets.py

      - name: Decoder unit tests (no network)
        run: python tests/test_decoder.py

      - name: Sparkplug payload unit tests (no network)
        run: python tests/test_sparkplug_payload.py

      - name: Declarative payload-mapping unit tests (no network)
        run: python tests/test_mapping.py

      - name: Prompt helpers must not leak into $(...) (shell)
        run: python tests/test_install_prompts.py

      - name: Python compiles
        run: python -m compileall -q src tests tools

      - name: Shell scripts parse
        run: |
          bash -n deploy/install.sh
          bash -n deploy/pipeline

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config validates
        run: docker compose config >/dev/null
