[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-sparkplug-vtscada"
version = "1.0.0"
description = "CLICK PLUS PLC -> MQTT -> TimescaleDB durable queue -> Sparkplug B -> VTScada historian"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "psycopg2-binary>=2.9,<3",
    "protobuf>=7.35,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# schema.sql is read at runtime by db.apply_schema(), and the .proto is kept
# next to the generated codec so the codec can be regenerated in place.
[tool.setuptools.package-data]
pipeline = ["schema.sql", "sparkplug/*.proto"]
